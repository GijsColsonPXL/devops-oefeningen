name: Uses Examples
on:
  workflow_dispatch:
  push:
jobs:
  uses-example:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run Python script
        run: python my_script.py
    
