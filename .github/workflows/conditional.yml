name: Conditional Example
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Choose the environment'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - staging
          - production
jobs:
  conditional-example:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to production
        if: github.event.inputs.environment == 'production'
        run: echo "Deploying to production!"
      - name: Running in test mode
        if: github.event.inputs.environment == 'development' || github.event.inputs.environment == 'staging'
        run: echo "Running in test mode"
      - name: Show chosen environment
        run: echo "Chosen environment: ${{ github.event.inputs.environment }}"